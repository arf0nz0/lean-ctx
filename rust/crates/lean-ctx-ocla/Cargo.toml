[package]
name = "lean-ctx-ocla"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Open Context & Token Lifecycle Architecture — the stable, provider-neutral contract boundary (14 traits, canonical types, token envelopes) shared between lean-ctx-core (OSS) and lean-ctx-enterprise (proprietary)."
repository = "https://github.com/yvgude/lean-ctx"
keywords = ["ocla", "llm", "tokens", "context", "contract"]
categories = ["development-tools", "api-bindings"]
readme = "README.md"


[lib]
name = "lean_ctx_ocla"

[dependencies]
async-trait = "0.1"
blake3 = "1.8"
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
